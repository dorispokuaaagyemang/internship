# Render Blueprint for the API (docs/DEPLOY-RENDER-VERCEL.md). The React app is on Vercel (client/vercel.json).
# MySQL stays on Aiven and file storage on Cloudflare R2; Render provides the API and Redis.
# Variables marked `sync: false` are asked for when the Blueprint is first applied.
services:
  - type: web
    name: internship-api
    runtime: node
    region: frankfurt # Render's closest region to Ghana
    plan: free # sleeps after 15 idle minutes; "starter" keeps it always on
    buildCommand: npm ci --workspace server --include-workspace-root
    preDeployCommand: npm run db:migrate -w server
    startCommand: npm start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # The queue workers run inside the API: one service instead of two.
      - key: RUN_WORKER_IN_API
        value: "true"
      # Vercel -> Render's load balancer; the client IP comes from Vercel's X-Real-IP (ORIGIN_SECRET).
      - key: TRUST_PROXY
        value: "1"
      # The same value goes in the Vercel project's ORIGIN_SECRET.
      - key: ORIGIN_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: internship-redis
          property: connectionString
      # The public Vercel URL, e.g. https://internship.vercel.app
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Aiven MySQL
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Paste the whole ca.pem (-----BEGIN CERTIFICATE----- ...).
      - key: DB_SSL_CA
        sync: false
      # Cloudflare R2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DATA_CONTROLLER_NAME
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false

  - type: keyvalue
    name: internship-redis
    region: frankfurt
    plan: free # 25 MB, not persisted: queued jobs are lost on a restart (the schedules come back)
    maxmemoryPolicy: noeviction # BullMQ must never have its keys evicted
    ipAllowList: [] # reachable only from Render services
