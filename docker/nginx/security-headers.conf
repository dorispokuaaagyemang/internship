# Security headers for the SPA and the API. Included in every location that sets its own
# add_header, because nginx drops server-level add_header lines in such locations.
#
# CSP: the build has no inline scripts or styles, and everything (API, Socket.IO) is same-origin.
# Resume and certificate downloads open presigned storage URLs as navigations, which CSP allows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
