# Shared by the HTTP (local compose) and HTTPS (production) servers.

client_max_body_size 6m; # resumes are capped at 5 MB by the API

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Socket.IO pings every 25 s; keep idle connections well past that.
    proxy_read_timeout 120s;
}

# Hashed build assets can be cached forever.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/hsts.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# SPA fallback: client-side routes resolve to index.html, which is never cached so a new
# release is picked up on the next load.
location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/hsts.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
